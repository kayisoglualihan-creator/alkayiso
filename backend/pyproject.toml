[project]
name = "jarvis-core"
version = "0.4.0"
description = "J.A.R.V.I.S. – persönlicher KI-Assistent (Backend)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: startet echte Serverprozesse"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ISC"]
ignore = ["B008", "E501", "SIM105", "SIM108", "B904", "UP047"]
